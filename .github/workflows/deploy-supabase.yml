name: Deploy Memory Task Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/service-console/**'
      - '.github/workflows/deploy-supabase.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify deployment access
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add the SUPABASE_ACCESS_TOKEN repository secret before deploying."
            exit 1
          fi
      - run: npx supabase@latest functions deploy service-console --project-ref evrbaaeccuwaxclnpknk
